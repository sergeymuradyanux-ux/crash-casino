<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orbit Crash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0e17;--bg2:#111520;--bg3:#171c2d;--card:#141824;--card2:#1a2030;
  --border:#1e2535;--border2:#252d40;
  --blue:#4f6ef7;--blue-dk:#3454d1;
  --green:#22c55e;--red:#ef4444;--gold:#f4b942;
  --text:#e8eaf2;--text2:#8892a4;--text3:#4a5568;
  --r-lg:14px;--r-md:10px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{
    height: 100%;
    overflow: hidden;
    background: var(--bg);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);
  max-width:480px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

/* TOP HUD */
.top-hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  height: 55px;
  flex-shrink: 0;
}
.hud-logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.hud-logo span{color:var(--blue)}
.hud-bal{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border2);
  border-radius:var(--r-lg);padding:6px 12px;
}
.hud-bal-num{font-size:15px;font-weight:800;color:var(--gold)}

/* MAIN CONTENT AREA */
.main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* Contains the scrollable pages */
    position: relative;
}

.page {
    display: none;
    flex-direction: column;
    height: 100%;
    width: 100%;
}

.page.active {
    display: flex;
}

/* CRASH PAGE SPECIFIC LAYOUT */
.game-section {
    flex: 1; /* This makes the rocket grid shrink/grow */
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    min-height: 0; 
}

.game-wrap{
  flex: 1;
  border-radius:var(--r-lg);
  overflow:hidden;position:relative;
  border:1px solid var(--border);
  background:#080b14;
  min-height: 180px; /* Minimum height for the rocket grid */
}

canvas#gc{position:absolute;inset:0;width:100%;height:100%}

.mult-overlay{
    position:absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align:center;
    pointer-events:none;
}
.mn{font-size:56px;font-weight:900;line-height:1;}
.mn.wait{color:rgba(255,255,255,0.1)}

/* LISTS & TABS */
.pl-wrap{
  height: 140px; /* Fixed height to protect button space */
  margin: 10px 12px;
  display:flex;flex-direction:column;
  flex-shrink: 0;
}
.pl-list{
    flex:1; overflow-y:auto; background:var(--card); 
    border-radius:var(--r-md); border:1px solid var(--border);
    font-size: 13px; padding: 10px;
}

/* ACTION BUTTON AREA */
.act-area{
  padding: 10px 14px 14px;
  background:var(--bg2);
  border-top:1px solid var(--border);
  flex-shrink: 0;
}

.btn{
  width: 100%;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:var(--r-lg);
  font-weight:800; font-size: 17px;
  min-height:54px; transition:0.1s;
}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:active{transform:scale(0.98);}

/* BOTTOM NAV */
.nav{
  display:flex;
  background:var(--bg2);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  height: 65px;
  flex-shrink: 0;
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border:none;background:none;
  color:var(--text3);font-size:10px;font-weight:700;
}
.nb.active{color:var(--blue)}
</style>
</head>
<body>

<div class="top-hud">
  <div class="hud-logo">🚀 Orbit<span>Crash</span></div>
  <div class="hud-bal">
    <span class="hud-bal-num" id="stars-disp">1,000</span>
    <div style="background:var(--blue); padding: 2px 6px; border-radius:4px; font-weight:bold">+</div>
  </div>
</div>

<div class="main-container">
  <div id="page-crash" class="page active">
    <div class="game-section">
      <div class="game-wrap">
        <canvas id="gc"></canvas>
        <div class="mult-overlay">
          <div class="mn wait" id="mn">1.00x</div>
          <div style="font-size:11px; color:var(--text3); font-weight:700; margin-top:5px">WAITING FOR BETS</div>
        </div>
      </div>
    </div>

    <div class="pl-wrap">
        <div style="font-size:11px; color:var(--text3); margin-bottom:5px; font-weight:bold">ALL BETS</div>
        <div class="pl-list" id="pl-list">
          <div style="color:var(--text3); text-align:center; padding-top:20px">No bets in this round</div>
        </div>
    </div>

    <div class="act-area">
      <button class="btn btn-primary" id="mbtn">PLACE BET</button>
    </div>
  </div>

  <div id="page-tasks" class="page">
      <div style="padding: 20px; text-align:center">Tasks Coming Soon</div>
  </div>
</div>

<nav class="nav">
  <button class="nb active" onclick="showPage('crash')"><span>🚀</span><br>CRASH</button>
  <button class="nb" onclick="showPage('tasks')"><span>⚒️</span><br>TASKS</button>
  <button class="nb"><span>🏆</span><br>TOP</button>
  <button class="nb"><span>👤</span><br>PROFILE</button>
</nav>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Page Switcher
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    
    document.querySelectorAll('.nb').forEach(n => n.classList.remove('active'));
    event.currentTarget.classList.add('active');
}

// Canvas Setup
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    drawGrid();
}

function drawGrid() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.strokeStyle = '#1e2535';
    ctx.lineWidth = 1;
    let step = canvas.width / 6;
    for(let i=0; i<=canvas.width; i+=step) {
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
    }
    for(let i=0; i<=canvas.height; i+=step) {
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
    }
}

window.addEventListener('resize', resize);
setTimeout(resize, 150);

// Basic Interaction
const mbtn = document.getElementById('mbtn');
mbtn.onclick = () => {
    tg.HapticFeedback.impactOccurred('heavy');
    mbtn.innerText = "BET PLACED";
    mbtn.style.opacity = "0.5";
    mbtn.disabled = true;
};
</script>

</body>
</html>
